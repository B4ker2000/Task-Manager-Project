<div class="dashboard-wrapper">
    <header class="main-header">
        <h1>Task Manager Workspace</h1>
        <div class="header-navigation-actions">
            <button class="submit-btn profile-btn" [routerLink]="['/profile']">👤 User Profile</button>
            <button class="cancel-btn logout-btn" (click)="onLogout()">Sign Out</button>
        </div>
    </header>

    <div class="dashboard-grid">
        <!-- Left Side: Create New Project Form -->
        <section class="form-section">
            <h3>Create New Project</h3>
            <form (ngSubmit)="onCreateProject()" #projectForm="ngForm">
                <div class="form-group">
                    <label>Project Title</label>
                    <input type="text" name="name" [(ngModel)]="newProject.name" required placeholder="e.g. Website Overhaul" />
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" [(ngModel)]="newProject.description" placeholder="Describe the project goal..."></textarea>
                </div>

                <button type="submit" class="create-btn" [disabled]="!projectForm.form.valid">Create Project</button>
            </form>
        </section>

        <!-- Right Side: Existing Project Cards List -->
        <section class="list-section">
            <h3>Your Projects</h3>
            <p class="empty-msg" *ngIf="projects.length === 0">No projects found. Create one to get started!</p>

            <div class="project-cards-grid">
                <div class="project-card" *ngFor="let p of projects">
                    <div class="project-card-header">
                        <h4>🎯 {{ p.title }}</h4>
                        <button *ngIf="p.userRole === 'Owner'" class="delete-proj-btn" (click)="onDeleteProject(p.id, $event)" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.4">🗑️</button>
                    </div>
                    <p>{{ p.description || 'No description provided.' }}</p>
                    <button class="submit-btn view-tasks-btn" [routerLink]="['/projects', p.id, 'board']">Open Project Board</button>
                </div>
            </div>
        </section>
    </div>
</div>
