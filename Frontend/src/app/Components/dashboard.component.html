<div class="dashboard-wrapper" role="main" [attr.aria-label]="langService.words().DASHBOARD.MAIN_CANVAS_LABEL">
    <header class="main-header">
        <h1 id="dashboardMainHeader" [innerHTML]="langService.words().DASHBOARD.MAIN_HEADER"></h1>
        <div class="header-navigation-actions" role="navigation" [attr.aria-label]="langService.words().DASHBOARD.NAV_ARIA">
            <button class="submit-btn profile-btn" [routerLink]="['/profile']">
                <span aria-hidden="true">👤</span>
                <span [innerHTML]="langService.words().DASHBOARD.PROFILE_BTN"></span>
            </button>
            <button class="cancel-btn logout-btn" 
                    (click)="onLogout()" 
                    [attr.aria-label]="langService.words().DASHBOARD.LOGOUT_ARIA"
                    [innerHTML]="langService.words().DASHBOARD.LOGOUT_BTN"></button>
        </div>
    </header>

    <div class="dashboard-grid">
        <!-- Left Side: Create New Project Form -->
         <section class="form-section" role="region" aria-labelledby="createProjectHeader">
            <h3 id="createProjectHeader" [innerHTML]="langService.words().DASHBOARD.CREATE_PROJECT_HEADER"></h3>
            <form (ngSubmit)="onCreateProject()" #projectForm="ngForm" aria-labelledby="createProjectHeader">
                <div class="form-group">
                    <label for="projectTitle" [innerHTML]="langService.words().DASHBOARD.PROJECT_TITLE_LABEL"></label>
                    <input id="projectTitle" 
                           type="text" 
                           name="name" 
                           [(ngModel)]="newProject.name" 
                           required 
                           [placeholder]="langService.words().DASHBOARD.PROJECT_TITLE_PLACEHOLDER" 
                           class="new-project input"
                           aria-required="true" />
                </div>

                <div class="form-group">
                    <label for="description" [innerHTML]="langService.words().DASHBOARD.DESCRIPTION_LABEL"></label>
                    <textarea id="description" 
                              name="description" 
                              [(ngModel)]="newProject.description" 
                              [placeholder]="langService.words().DASHBOARD.DESCRIPTION_PLACEHOLDER" 
                              class="new-project textarea"></textarea>
                </div>

                <button type="submit" 
                        class="create-btn" 
                        [disabled]="!projectForm.form.valid"
                        [attr.aria-label]="langService.words().DASHBOARD.CREATE_BTN_ARIA"
                        [innerHTML]="langService.words().DASHBOARD.CREATE_BTN_TEXT"></button>
            </form>
         </section>

        <!-- Right Side: Existing Project Cards List -->
        <!-- 📡 Enriched the live region to announce dynamic item card injections and deletions cleanly -->
         <section class="list-section" role="region" aria-labelledby="projectsListHeader" aria-live="polite" aria-relevant="additions removals">
            <h3 id="projectsListHeader" [innerHTML]="langService.words().DASHBOARD.YOUR_PROJECTS_HEADER"></h3>
            <p class="empty-msg" 
               *ngIf="projects.length === 0" 
               role="status" 
               [innerHTML]="langService.words().DASHBOARD.EMPTY_MESSAGE"></p>

            <div class="project-cards-grid">
                <div class="project-card" *ngFor="let p of projects" role="article" [attr.aria-label]="formatLabel(langService.words().DASHBOARD.PROJECT_CARD_ARIA, p.title)">
                    <div class="project-card-header">
                        <h4 [attr.id]="'proj-title-' + p.id">
                            <span aria-hidden="true">🎯</span> {{ p.title }}
                        </h4>

                        <!-- 🗑️ Smart Dynamic Label: Explicitly states WHICH project this button will delete -->
                         <button *ngIf="p.userRole === 'Owner'" 
                                 class="delete-proj-btn" 
                                 (click)="onDeleteProject(p.id, $event)" 
                                 [attr.aria-label]="formatLabel(langService.words().DASHBOARD.DELETE_PROJECT_ARIA, p.title)"
                                 [attr.aria-describedby]="'proj-title-' + p.id">
                                 
                            <span aria-hidden="true">🗑️</span>
                         </button>
                    </div>
                    <p>{{ p.description || langService.words().DASHBOARD.NO_DESCRIPTION_FALLBACK }}</p>
                    
                    <button class="submit-btn view-tasks-btn" 
                            [routerLink]="['/projects', p.id, 'board']"
                            [attr.aria-label]="formatLabel(langService.words().DASHBOARD.OPEN_BOARD_ARIA, p.title)"
                            [innerHTML]="langService.words().DASHBOARD.OPEN_BOARD_TEXT"></button>
                </div>
            </div>
         </section>
    </div>

    <!-- Universally Bound Popup Context Overlay -->
     <app-popup *ngIf="popupConfig.visible"
                [type]="popupConfig.type"
                [title]="popupConfig.title"
                [body]="popupConfig.body"
                [isConfirmation]="popupConfig.isConfirmation"
                (confirm)="handlePopupConfirm()"
                (cancel)="closePopup()"></app-popup>
</div>
