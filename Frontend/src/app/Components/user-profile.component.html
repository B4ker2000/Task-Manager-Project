<div class="profile-wrapper" role="main" [attr.aria-label]="langService.words().PROFILE.ARIA_MAIN">
    <header class="profile-header">
        <!-- 🔙 Back Button: Added explicit label and instruction for non-sighted users & Bound to localized descriptive strings -->
        <button class="back-btn" [routerLink]="['/dashboard']" [attr.aria-label]="langService.words().GLOBAL.BACK_BTN_ARIA" [innerHTML]="langService.words().GLOBAL.BACK_BTN_TEXT"></button>
        <h2 [innerHTML]="langService.words().PROFILE.IDENTITY_TITLE"></h2>
    </header>

    <!-- Loading Placeholder Spinner Card Layout -->
     <!-- 🚨 aria-live="assertive" forces the screen reader to instantly read the loading status on load -->
      <div class="loading-state" *ngIf="isLoading" role="status" aria-live="assertive">
        <p [innerHTML]="langService.words().PROFILE.SYNCING_CREDENTIALS"></p>
      </div>

    <!-- Active Profile Layout Card Display -->
     <div class="profile-card-grid" *ngIf="!isLoading && userProfile">
        <div class="profile-layout-vertical-stack">
            <!-- Section 1: Core Account Details Card -->
             <div class="details-card" role="region" [attr.aria-label]="langService.words().PROFILE.CORE_ACCOUNT_ARIA">
                <!-- 👤 EMOJI PROTECTION: aria-hidden="true" stops screen reader from saying "Silhouette" aloud -->
                 <div class="avatar-circle" aria-hidden="true">👤</div>
                <!-- aria-level explicitly clarifies structural typographic depth -->
                 <h3 aria-level="3">{{ userProfile.username }}</h3>
                 <span class="role-badge" [ngClass]="userProfile.role.toLowerCase()" role="text" [attr.aria-label]="langService.words().PROFILE.SECURITY_LEVEL_LABEL + ' ' + userProfile.role">
                    <span aria-hidden="true">💼 </span> 
                    <span [innerHTML]="langService.words().PROFILE.SECURITY_LEVEL_LABEL"></span> {{ userProfile.role }}
                 </span>

                <div class="info-row">
                    <strong id="emailLabel">{{ langService.words().PROFILE.REGISTERED_EMAIL_LABEL }}</strong>
                    <span [attr.aria-labelledby]="'emailLabel'">{{ userProfile.email }}</span>
                </div>
                <div class="info-row">
                    <strong id="recordLabel" [innerHTML]="langService.words().PROFILE.DATABASE_RECORD_LABEL"></strong>
                    <span [attr.aria-labelledby]="'recordLabel'">#{{ userProfile.id }}</span>
                </div>
             </div>

            <!-- Section 2: Quick Metrics Statistics Card -->
             <div class="stats-card" role="region" [attr.aria-label]="langService.words().PROFILE.SYSTEM_METRICS_TITLE">
                <h4 aria-level="4">
                    <span aria-hidden="true">📋 </span>
                    <span [innerHTML]="langService.words().PROFILE.SYSTEM_METRICS_TITLE"></span>
                </h4>
                <div class="metric-box" [attr.aria-label]="userProfile.stats.total + ' ' + langService.words().PROFILE.ASSIGNED_ITEMS_ARIA">
                    <span class="metric-label" aria-hidden="true" [innerHTML]="langService.words().PROFILE.ASSIGNED_ITEMS_LABEL"></span>
                    <span class="metric-num" aria-hidden="true">{{ userProfile.stats.total }}</span>
                </div>
                <div class="metric-box status-done" [attr.aria-label]="userProfile.stats.completed + ' ' + langService.words().PROFILE.COMPLETED_TASKS_ARIA">
                    <span class="metric-label" aria-hidden="true" [innerHTML]="langService.words().PROFILE.COMPLETED_TASKS_LABEL"></span>
                    <span class="metric-num" aria-hidden="true">{{ userProfile.stats.completed }}</span>
                </div>
             </div>
        </div>

        <div class="profile-layout-vertical-stack">
            <!-- Section 3: Accessibility, Themes & Localization options -->
             <div class="accessibility-config-card" role="region" [attr.aria-label]="langService.words().PROFILE.WORKSPACE_TITLE">
                <h4 aria-level="4">
                    <span aria-hidden="true">🎨 </span>
                    <span [innerHTML]="langService.words().PROFILE.WORKSPACE_TITLE"></span>
                </h4>

                <div class="config-control-row">
                    <!-- 🌐 Language Selection Dropdown -->
                     <div class="info-adjustment-group">
                        <label for="languageSelect" class="info-adjustment-label">
                            <span aria-hidden="true">🌐 </span>
                            <span [innerHTML]="langService.words().GLOBAL.LANGUAGE_SELECTION_TITLE"></span>
                        </label>
                        <select id="languageSelect"
                                [ngModel]="langService.currentLang()"
                                (ngModelChange)="onLanguageChangeEngineTrigger($event)"
                                class="board-interactive-field select-config"
                                [attr.aria-label]="langService.words().GLOBAL.LANGUAGE_SELECTION_ARIA">

                            <option value="en-us" [innerHTML]="langService.words().GLOBAL.LANGUAGE_OPTION_EN_US"></option>
                            <option value="jp" [innerHTML]="langService.words().GLOBAL.LANGUAGE_OPTION_JP"></option>
                            <option value="ru" [innerHTML]="langService.words().GLOBAL.LANGUAGE_OPTION_RU"></option>
                        </select>
                     </div>

                    <!-- Theme Selector -->
                     <div class="info-adjustment-group">
                        <label for="themeEngineSelect" class="info-adjustment-label" [innerHTML]="langService.words().PROFILE.THEME_LABEL"></label>
                        <div class="control-input-wrapper">
                            <!-- aria-haspopup notifies screen reader users that a selection overlay menu is active -->
                             <select id="themeEngineSelect" 
                                    [(ngModel)]="activeTheme" 
                                    (change)="onThemeChangeEngineTrigger()" 
                                    class="board-interactive-field select-config"
                                    aria-haspopup="listbox"
                                    [attr.aria-label]="langService.words().PROFILE.THEME_LABEL">

                                <!-- The aria-label forces the voice engine to read clean text, ignoring the emojis! -->
                                 <option value="light" [attr.aria-label]="langService.words().PROFILE.THEME_OPTION_LIGHT" [innerHTML]="langService.words().PROFILE.THEME_OPTION_LIGHT"></option>
                                 <option value="dark" [attr.aria-label]="langService.words().PROFILE.THEME_OPTION_DARK" [innerHTML]="langService.words().PROFILE.THEME_OPTION_DARK"></option>
                                 <option value="amber-crt" [attr.aria-label]="langService.words().PROFILE.THEME_OPTION_AMBER" [innerHTML]="langService.words().PROFILE.THEME_OPTION_AMBER"></option>
                                 <option value="matrix-crt" [attr.aria-label]="langService.words().PROFILE.THEME_OPTION_MATRIX" [innerHTML]="langService.words().PROFILE.THEME_OPTION_MATRIX"></option>
                                 <option value="high-contrast-black" [attr.aria-label]="langService.words().PROFILE.THEME_OPTION_HC_BLACK" [innerHTML]="langService.words().PROFILE.THEME_OPTION_HC_BLACK"></option>
                                 <option value="high-contrast-white" [attr.aria-label]="langService.words().PROFILE.THEME_OPTION_HC_WHITE" [innerHTML]="langService.words().PROFILE.THEME_OPTION_HC_WHITE"></option>
                                 <option value="high-contrast-beige" [attr.aria-label]="langService.words().PROFILE.THEME_OPTION_HC_BEIGE" [innerHTML]="langService.words().PROFILE.THEME_OPTION_HC_BEIGE"></option>
                                 <option value="95/98" [attr.aria-label]="langService.words().PROFILE.THEME_OPTION_WIN98" [innerHTML]="langService.words().PROFILE.THEME_OPTION_WIN98"></option>
                                 <option value="xp" [attr.aria-label]="langService.words().PROFILE.THEME_OPTION_WINXP" [innerHTML]="langService.words().PROFILE.THEME_OPTION_WINXP"></option>
                                 <option value="vista" [attr.aria-label]="langService.words().PROFILE.THEME_OPTION_VISTA" [innerHTML]="langService.words().PROFILE.THEME_OPTION_VISTA"></option>
                                 <option value="7" [attr.aria-label]="langService.words().PROFILE.THEME_OPTION_WIN7" [innerHTML]="langService.words().PROFILE.THEME_OPTION_WIN7"></option>
                                 <option value="frutiger-aero" [attr.aria-label]="langService.words().PROFILE.THEME_OPTION_AERO" [innerHTML]="langService.words().PROFILE.THEME_OPTION_AERO"></option>
                                 <option value="BA" [attr.aria-label]="langService.words().PROFILE.THEME_OPTION_BA" [innerHTML]="langService.words().PROFILE.THEME_OPTION_BA"></option>
                             </select>
                        </div>
                     </div>

                    <!-- Font Selector -->
                     <div class="info-adjustment-group">
                        <label for="fontSelect" class="info-adjustment-label" [innerHTML]="langService.words().PROFILE.FONT_LABEL"></label>
                        <select id="fontSelect" 
                                [(ngModel)]="activeFont" 
                                (change)="onFontChangeEngineTrigger()"
                                aria-haspopup="listbox"
                                [attr.aria-label]="langService.words().PROFILE.FONT_ARIA"
                                [attr.aria-description]="langService.words().PROFILE.FONT_DESCRIPTION">
                            
                            <option value="" [innerHTML]="langService.words().PROFILE.FONT_OPTION_DEFAULT"></option>
                            <option value="dejavu" [innerHTML]="langService.words().PROFILE.FONT_OPTION_LEGI"></option>
                            <option value="dyslexic" [innerHTML]="langService.words().PROFILE.FONT_OPTION_DYS"></option>
                        </select>
                     </div>

                    <!-- Colorblind Filter Selector -->
                     <div class="info-adjustment-group">
                        <label for="colorblindSelect" class="info-adjustment-label" [innerHTML]="langService.words().PROFILE.COLORBLIND_LABEL"></label>
                        <select id="colorblindSelect" 
                                [(ngModel)]="activeColorblind" 
                                (change)="onColorblindChangeEngineTrigger()"
                                aria-haspopup="listbox"
                                [attr.aria-label]="langService.words().PROFILE.COLORBLIND_ARIA">
                            
                            <option value="" [innerHTML]="langService.words().PROFILE.COLORBLIND_OPTION_NONE"></option>
                            <option value="deuteranopia" [innerHTML]="langService.words().PROFILE.COLORBLIND_OPTION_DEU"></option>
                            <option value="protanopia" [innerHTML]="langService.words().PROFILE.COLORBLIND_OPTION_PRO"></option>
                            <option value="tritanopia" [innerHTML]="langService.words().PROFILE.COLORBLIND_OPTION_TRI"></option>
                            <option value="grayscale" [innerHTML]="langService.words().PROFILE.COLORBLIND_OPTION_GRA"></option>
                        </select>
                     </div>
                </div>
             </div>

            <!-- Section 4: Update account info -->
             <div class="settings-card" role="region" aria-label="Account Management Settings">
                <h4 aria-level="4">
                    <span aria-hidden="true">⚙️ </span>
                    <span [innerHTML]="langService.words().PROFILE.ACCOUNT_SETTINGS_TITLE"></span>
                </h4>

                <!-- Account Information Adjustment Form -->
                 <form (ngSubmit)="onUpdateAccount()" #settingsForm="ngForm" class="info-adjustment-form">
                    <div class="info-adjustment-group">
                        <label for="newUsername" class="info-adjustment-label" [innerHTML]="langService.words().PROFILE.UPDATE_USER_LABEL"></label>
                        <input id="newUsername" 
                               type="text" 
                               name="newUsername" 
                               [(ngModel)]="updateData.NewUsername" 
                               [placeholder]="langService.words().PROFILE.UPDATE_USER_PLACEHOLDER" 
                               class="info-adjustment-input newUsername" />
                    </div>

                    <div class="info-adjustment-group">
                        <label for="newPassword" class="info-adjustment-label" [innerHTML]="langService.words().PROFILE.CHANGE_PASS_LABEL"></label>
                        <div class="password-input-wrapper">
                            <input id="newPassword" 
                                   [type]="showPassword ? 'text' : 'password'" 
                                   name="newPassword" 
                                   [(ngModel)]="updateData.NewPassword" 
                                   [placeholder]="langService.words().PROFILE.CHANGE_PASS_PLACEHOLDER"
                                   class="info-adjustment-input newPassword"
                                   aria-describedby="passwordRequirements" />

                            <!-- 👁️ PASSWORD REVEAL TOGGLE: Custom aria tags communicate if text is masked or visible -->
                            <button type="button" 
                                    class="eye-toggle-btn" 
                                    (click)="showPassword = !showPassword"
                                    [attr.aria-label]="showPassword ? langService.words().GLOBAL.SHOW_PASS_ARIA : langService.words().GLOBAL.HIDE_PASS_ARIA"
                                    [attr.aria-pressed]="showPassword">
                                
                                <span aria-hidden="true">{{ showPassword ? '👁️' : '👁️‍🗨️' }}</span>
                            </button>
                        </div>
                    </div>

                    <div class="info-adjustment-group">
                        <label for="confirmNewPassword" class="info-adjustment-label" [innerHTML]="langService.words().PROFILE.CONFIRM_PASS_LABEL"></label>
                        <!-- <input [type]="showPassword ? 'text' : 'password'" name="confirmNewPassword" [(ngModel)]="confirmNewPassword" placeholder="Retype your new password..." class="info-adjustment-input" /> --> <!-- This will make it so that both password textboxes are bound to the same reveal "eye" button -->
                         <div class="password-input-wrapper">
                            <input id="confirmNewPassword" 
                                   [type]="showConfirmPassword ? 'text' : 'password'" 
                                   name="confirmNewPassword" 
                                   [(ngModel)]="confirmNewPassword" 
                                   [placeholder]="langService.words().PROFILE.CONFIRM_PASS_PLACEHOLDER"
                                   class="info-adjustment-input newPasswordConfirm"
                                   [attr.aria-invalid]="updateData.NewPassword !== confirmNewPassword" />

                            <button type="button" 
                                    class="eye-toggle-btn" 
                                    (click)="showConfirmPassword = !showConfirmPassword" 
                                    [attr.aria-label]="showConfirmPassword ? langService.words().GLOBAL.SHOW_CONFIRM_ARIA : langService.words().GLOBAL.HIDE_CONFIRM_ARIA"
                                    [attr.aria-pressed]="showConfirmPassword">

                                <span aria-hidden="true">{{ showConfirmPassword ? '👁️' : '👁️‍🗨️' }}</span>
                            </button>
                         </div>
                    </div>

                    <!-- Hidden helper utility read automatically by modern audio navigation suites -->
                     <span id="passwordRequirements" style="display: none;" [innerHTML]="langService.words().PROFILE.PASS_REQUIREMENTS_ARIA"></span>

                    <button type="submit" 
                            class="save-settings-btn" 
                            [disabled]="(!updateData.NewUsername?.trim()) && (!updateData.NewPassword?.trim() || updateData.NewPassword !== confirmNewPassword)"
                            [innerHTML]="langService.words().PROFILE.SAVE_CHANGES_BTN"></button>
                 </form>

                <hr aria-hidden="true">

                <!-- High Risk Destruction Action Block -->
                 <!-- role="alertdialog" alerts the user immediately to prioritize their focus onto this block -->
                 <div class="danger-zone" role="alertdialog" aria-labelledby="dangerZoneHeader" aria-describedby="dangerZoneWarnMsg">
                    <span aria-hidden="true">⚠️ </span>
                    <span id="dangerZoneHeader" class="danger-zone-header" [innerHTML]="langService.words().PROFILE.DANGER_ZONE_TITLE"></span>
                    <p id="dangerZoneWarnMsg" class="danger-zone-warning" [innerHTML]="langService.words().PROFILE.DANGER_ZONE_WARN"></p>
                    <button type="button" 
                            (click)="onDeleteAccount()" 
                            class="danger-zone-btn"
                            aria-label="Permanently delete account workspace and credentials forever" [innerHTML]="langService.words().PROFILE.DANGER_ZONE_BTN"></button>
                 </div>
             </div>
        </div>
     </div>
</div>
