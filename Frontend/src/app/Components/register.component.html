<div class="register-wrapper"
     role="main"
     aria-label="Account Creation Portal">
    
    <div class="register-card">
        <h2 id="registerHeader">Create Workspace Account</h2>
        <p class="subtitle">Join the project management platform!</p>
        
        <!-- aria-labelledby provides instant spatial context to the screen reader user -->
         <form (ngSubmit)="onRegister()" #registerForm="ngForm" aria-labelledby="registerHeader">

            <!-- 👤 Username Input Group -->
             <div class="form-group">
                <label for="username">Username</label>
                <input id="username" 
                       type="text" 
                       name="username" 
                       [(ngModel)]="registerData.Username" 
                       required 
                       placeholder="Pick a unique display name..."
                       aria-required="true"
                       autofocus />
             </div>

            <!-- 📧 Email Input Group -->
             <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" 
                       type="email" 
                       name="email"
                       [(ngModel)]="registerData.Email" 
                       required 
                       email 
                       placeholder="e.g. employee@company.com"
                       aria-required="true" />
             </div>

            <!-- 🔒 Password Selection Input Group -->
             <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-wrapper">
                    <input id="password" 
                           [type]="showPassword ? 'text' : 'password'" 
                           name="password" 
                           [(ngModel)]="registerData.Password" 
                           required 
                           placeholder="Create a secure password..." 
                           aria-required="true"
                           aria-describedby="registerPasswordRequirements" />
                        
                    <!-- 👁️ Primary Visibility Button -->
                     <button type="button" 
                            class="eye-toggle-btn" 
                            (click)="showPassword = !showPassword"
                            [attr.aria-label]="showPassword ? 'Show plain text password' : 'Hide plain text password'"
                            [attr.aria-pressed]="showPassword">

                        <span aria-hidden="true">{{ showPassword ? '👁️' : '👁️‍🗨️' }}</span>
                     </button>
                </div>
             </div>

            <!-- 🔒 Password Confirmation Input Group -->
             <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-input-wrapper">
                    <input id="confirmPassword" 
                           [type]="showConfirmPassword ? 'text' : 'password'" 
                           name="confirmPassword" 
                           [(ngModel)]="confirmPassword" 
                           required 
                           placeholder="Retype your password..."
                           aria-required="true"
                           [attr.aria-invalid]="registerData.Password !== confirmPassword" />
                    
                    <!-- 👁️ Confirmation Visibility Button -->
                     <button type="button" 
                            class="eye-toggle-btn" 
                            (click)="showConfirmPassword = !showConfirmPassword"
                            [attr.aria-label]="showConfirmPassword ? 'Show plain text confirmation password' : 'Hide plain text confirmation password'"
                            [attr.aria-pressed]="showConfirmPassword">

                        <span aria-hidden="true">{{ showConfirmPassword ? '👁️' : '👁️‍🗨️' }}</span>
                     </button>
                </div>
             </div>

            <!-- 💡 Hidden layout helper text linked to inputs -->
             <span id="registerPasswordRequirements" style="display: none;">Both password fields must match exactly before registration requests can submit.</span>

            <!-- 🏁 Submission Hub -->
             <button type="submit" 
                    class="submit-btn register-btn" 
                    [disabled]="!registerForm.form.valid"
                    aria-label="Submit credentials to register your new account">Sign Up</button>
         </form>

        <!-- 🗺️ Footnote Navigation Links -->
         <div class="register-footer" role="navigation" aria-label="Alternative entry link">
            <p>
                Already have an account? 
                <a [routerLink]="['/login']" class="login-link">Back to Sign In</a>
            </p>
         </div>
    </div>
</div>
