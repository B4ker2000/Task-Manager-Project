<router-outlet></router-outlet>

@if ((popupService.config$ | async)?.visible) {
    <app-popup [type]="(popupService.config$ | async)?.type || 'success'"
               [title]="(popupService.config$ | async)?.title || ''"
               [body]="(popupService.config$ | async)?.body || ''"
               [isConfirmation]="(popupService.config$ | async)?.isConfirmation || false"
               (confirm)="handleGlobalConfirm()"
               (cancel)="handleGlobalCancel()"></app-popup>
}
