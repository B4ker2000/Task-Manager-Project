<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Task Manager Workspace</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('user-preferred-theme');
        if(savedTheme) {
          document.documentElement.setAttribute('data-theme', savedTheme);
        }
      } catch(e) { console.error("Theme pre-init catch:", e); }
    })();
  </script>
  <link rel="stylesheet" href="https://cdnfonts.com">
  <link rel="stylesheet" href="https://googleapis.com">
</head>
<body>
  <app-root></app-root>
  <!-- Invisible SVG Colorblind Filters -->
   <svg style="position: absolute; width: 0; height: 0;" aria-hidden="true" focusable="false">
    <defs>
      <!-- Deuteranopia Filter Matrix -->
       <filter id="deuteranopia-filter">
        <feColorMatrix type="matrix" values="0.625, 0.375, 0, 0, 0,  0.7, 0.3, 0, 0, 0,  0, 0.3, 0.7, 0, 0,  0, 0, 0, 1, 0" />
       </filter>
      
      <!-- Protanopia Filter Matrix -->
       <filter id="protanopia-filter">
        <feColorMatrix type="matrix" values="0.567, 0.433, 0, 0, 0,  0.558, 0.442, 0, 0, 0,  0, 0.242, 0.758, 0, 0,  0, 0, 0, 1, 0" />
       </filter>

      <!-- Tritanopia Filter Matrix -->
       <filter id="tritanopia-filter">
        <feColorMatrix type="matrix" values="0.95, 0.05, 0, 0, 0,  0, 0.433, 0.567, 0, 0,  0, 0.475, 0.525, 0, 0,  0, 0, 0, 1, 0" />
       </filter>
    </defs> 
   </svg>
</body>
</html>
