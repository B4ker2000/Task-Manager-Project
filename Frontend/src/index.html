<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Task Manager Workspace</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('user-preferred-theme');
        if(savedTheme) {
          document.documentElement.setAttribute('data-theme', savedTheme);
        }
      } catch(e) { console.error("Theme pre-init catch:", e); }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
